# MiniMessage 形式。<prefix> は prefix を差し込む
prefix: "<gradient:#7dd3fc:#a78bfa><bold>TabScore</bold></gradient> <dark_gray>»</dark_gray> "
no-permission: "<prefix><red>権限がありません。"
players-only: "<prefix><red>プレイヤーのみ実行できます。"
usage: "<prefix><gray>/tabscore <white>change <項目> <dark_gray>| <white>me [項目] <dark_gray>| <white>top <項目> <dark_gray>| <white>info <プレイヤー> <dark_gray>| <white>reload <dark_gray>| <white>import"
unknown-metric: "<prefix><red>不明な項目です: <white><input>"
unknown-player: "<prefix><red>プレイヤーが見つかりません: <white><input>"
changed: "<prefix><green>表示項目を <white><label> <green>(<white><selector><green>) に変更しました。"
current: "<prefix><gray>現在の表示項目: <white><label> <dark_gray>(<selector>)"
reloaded: "<prefix><green>設定を再読み込みしました。"
db-error: "<prefix><red>データベースエラー。コンソールを確認してください。"
me: "<prefix><gray><label>: <yellow><bold><value></bold><gray> <unit>"
top-header: "<prefix><gray><label> ランキング <dark_gray>(<unit>)"
top-line: "<gray><rank>. <white><name> <dark_gray>- <yellow><value>"
top-empty: "<gray>  データがありません。"
info-header: "<prefix><white><name> <gray>の統計"
info-line: "<gray><label>: <yellow><value><gray> <unit> <dark_gray>(今日 <today>)"
info-sub: "<dark_gray>   ┗ <gray><top>"
info-last: "<gray>最終ログイン: <white><time> <dark_gray>/ <gray>ログイン回数 <white><logins>"
import-start: "<prefix><gray>本体統計の取り込みを開始します(<count> 人)。"
import-progress: "<prefix><gray>取り込み中... <white><done>/<total>"
import-done: "<prefix><green>取り込み完了: <white><done> 人。"
import-already: "<prefix><red>取り込みは既に実行済みです(<time>)。"
import-confirm: "<prefix><yellow>本体の統計をこのプラグインの記録に加算します(1回のみ)。実行するなら <white>/tabscore import confirm"
import-running: "<prefix><red>取り込みは実行中です。"
import-op-only: "<prefix><red>/tabscore import は OP またはコンソールのみ実行できます。"
period:
  total: "累計"
  today: "今日"
  week: "週間"
cat:
  mine: "掘ったブロック"
  place: "置いたブロック"
  kill: "Mob キル"
  deaths: "死亡"
  damage_dealt: "与ダメージ"
  damage_taken: "被ダメージ"
  distance: "移動距離"
  playtime: "稼働時間"
  logins: "ログイン"
  fish: "釣り"
  breed: "繁殖"
  trade: "取引"
  use: "アイテム使用"
  craft: "アイテム作成"
  drop: "アイテムドロップ"
  pickup: "アイテム拾得"
  consume: "消費(飲食)"
  item_break: "道具の破損"
  chat: "チャット"
  command: "コマンド"
  jump: "ジャンプ"
  enchant: "エンチャント"
unit:
  count: "回"
  m: "m"
  min: "分"
  hp: "HP"
